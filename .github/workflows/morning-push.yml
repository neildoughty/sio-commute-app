name: Commute push notifications

on:
  schedule:
    - cron: '10 6 * * 1-5'   # 7:10am BST (summer, UTC+1)
    - cron: '10 7 * * 1-5'   # 7:10am GMT (winter, UTC+0)
    - cron: '45 16 * * 1-5'  # 5:45pm BST (summer, UTC+1)
    - cron: '45 17 * * 1-5'  # 5:45pm GMT (winter, UTC+0)
  workflow_dispatch:
    inputs:
      force_type:
        description: 'Force notification type (morning or evening)'
        required: false
        default: ''

jobs:
  send-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web-push
        run: npm install web-push

      - name: Send push notification
        env:
          TFL_API_KEY: ${{ secrets.TFL_API_KEY }}
          DARWIN_API_KEY: ${{ secrets.DARWIN_API_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          FORCE_TYPE: ${{ github.event.inputs.force_type }}
        run: node .github/scripts/send-push.js
