name: Test Worker

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
  pull_request:
    paths:
      - 'cloudflare/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
        working-directory: cloudflare
      - name: Run tests
        run: npm test
        working-directory: cloudflare
